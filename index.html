<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <title>PHS 소모품·미니바</title>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #f3f4f6);
      --card: var(--tg-theme-secondary-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #111827);
      --hint: var(--tg-theme-hint-color, #6b7280);
      --accent: var(--tg-theme-button-color, #2481cc);
      --accentText: var(--tg-theme-button-text-color, #ffffff);
      --line: color-mix(in srgb, var(--hint) 22%, transparent);
      --soft: color-mix(in srgb, var(--accent) 9%, var(--card));
      --danger: #d14343;
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif; }
    button { font:inherit; }
    .app { max-width:760px; margin:0 auto; padding:12px 10px calc(82px + env(safe-area-inset-bottom)); }
    .title { font-size:21px; font-weight:850; margin:2px 2px 3px; }
    .sub { color:var(--hint); font-size:12.5px; margin:0 2px 8px; }
    .search-wrap { position:sticky; top:0; z-index:4; display:grid; grid-template-columns:22px minmax(0,1fr) 30px; align-items:center; gap:4px; background:color-mix(in srgb,var(--card) 96%,transparent); backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:13px; padding:5px 7px; margin:0 0 9px; box-shadow:0 3px 12px color-mix(in srgb,var(--text) 5%,transparent); }
    .search-icon { color:var(--hint); text-align:center; font-size:15px; }
    .search-input { width:100%; min-width:0; height:34px; border:0; outline:0; background:transparent; color:var(--text); font:inherit; font-size:13.5px; }
    .search-input::placeholder { color:var(--hint); }
    .search-clear { width:29px; height:29px; border:0; border-radius:9px; background:transparent; color:var(--hint); font-size:20px; line-height:1; display:none; }
    .search-clear.visible { display:block; }
    .search-note { min-height:16px; margin:-4px 2px 7px; color:var(--hint); font-size:10.5px; }
    .workspace { display:grid; grid-template-columns:58px minmax(0,1fr); gap:8px; align-items:start; }
    .floors { position:sticky; top:8px; display:grid; gap:6px; max-height:calc(100vh - 105px); overflow-y:auto; scrollbar-width:none; padding-bottom:3px; }
    .floors::-webkit-scrollbar { display:none; }
    .floor-btn { border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:11px; min-height:42px; padding:5px 2px; font-size:13px; font-weight:800; }
    .floor-btn.active { background:var(--accent); border-color:var(--accent); color:var(--accentText); box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 24%,transparent); }
    .floor-btn.used:not(.active)::after { content:'•'; display:block; color:var(--accent); line-height:5px; font-size:15px; }
    .content { min-width:0; }
    .floor-status { background:var(--card); border-radius:14px; padding:9px 11px; margin-bottom:7px; display:flex; justify-content:space-between; gap:8px; align-items:center; }
    .floor-status strong { font-size:16px; }
    .floor-status span { color:var(--hint); font-size:11.5px; text-align:right; }
    .columns { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:6px; align-items:start; }
    .category { background:var(--card); border-radius:14px; overflow:hidden; min-width:0; }
    .category-head { position:sticky; top:0; z-index:1; display:flex; justify-content:space-between; align-items:baseline; gap:4px; padding:8px 8px 7px; background:var(--card); border-bottom:1px solid var(--line); }
    .category-head strong { font-size:15.5px; white-space:nowrap; }
    .category-head span { font-size:10.5px; color:var(--hint); white-space:nowrap; }
    .item-list { display:grid; }
    .item { min-width:0; min-height:39px; padding:5px 6px; border-bottom:1px solid var(--line); display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:5px; }
    .item:last-child { border-bottom:0; }
    .item.search-hit { background:color-mix(in srgb,var(--accent) 15%,var(--card)); outline:2px solid color-mix(in srgb,var(--accent) 48%,transparent); outline-offset:-2px; }
    .item-name { min-width:0; font-size:14px; font-weight:800; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin:0; }
    .stepper { display:grid; grid-template-columns:24px 34px 24px; gap:2px; align-items:center; }
    .stepper button { width:24px; height:28px; border:0; border-radius:7px; background:var(--soft); color:var(--accent); font-size:18px; font-weight:650; line-height:1; padding:0; }
    .stepper button:disabled { opacity:.28; }
    .qty { width:34px; height:28px; border:1px solid var(--line); border-radius:7px; font-size:14px; font-weight:850; text-align:center; padding:0 2px; outline:0; color:var(--text); background:color-mix(in srgb,var(--card) 94%,var(--bg)); }
    .qty:focus { border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 14%,transparent); }
    .qty.nonzero { border-color:color-mix(in srgb,var(--accent) 45%,var(--line)); color:var(--accent); background:var(--soft); }
    .add-item-wrap { margin-top:7px; }
    .add-item { width:100%; min-height:40px; border:1px dashed color-mix(in srgb,var(--accent) 55%,var(--line)); border-radius:12px; background:color-mix(in srgb,var(--accent) 6%,var(--card)); color:var(--accent); font-weight:850; font-size:13px; }
    .modal-backdrop { position:fixed; inset:0; z-index:20; display:none; align-items:flex-end; justify-content:center; background:rgba(0,0,0,.36); padding:12px; }
    .modal-backdrop.open { display:flex; }
    .modal { width:min(100%,520px); background:var(--card); border-radius:18px; padding:15px; box-shadow:0 18px 60px rgba(0,0,0,.28); }
    .modal h3 { margin:0 0 5px; font-size:17px; }
    .modal p { margin:0 0 12px; color:var(--hint); font-size:11.5px; }
    .category-choice { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-bottom:9px; }
    .category-choice button { border:1px solid var(--line); border-radius:10px; min-height:39px; background:var(--card); color:var(--text); font-weight:800; }
    .category-choice button.active { background:var(--soft); border-color:var(--accent); color:var(--accent); }
    .new-item-input { width:100%; height:44px; border:1px solid var(--line); border-radius:11px; background:var(--bg); color:var(--text); padding:0 12px; outline:0; font:inherit; }
    .new-item-input:focus { border-color:var(--accent); }
    .modal-actions { display:grid; grid-template-columns:.8fr 1.2fr; gap:8px; margin-top:11px; }
    .modal-actions button { border:0; border-radius:11px; min-height:44px; font-weight:850; }
    .modal-cancel { background:var(--soft); color:var(--accent); }
    .modal-add { background:var(--accent); color:var(--accentText); }
    .footer { position:fixed; left:0; right:0; bottom:0; z-index:5; background:color-mix(in srgb,var(--card) 94%,transparent); backdrop-filter:blur(16px); border-top:1px solid var(--line); padding:9px 10px calc(9px + env(safe-area-inset-bottom)); }
    .footer-inner { max-width:760px; margin:0 auto; display:grid; grid-template-columns:.9fr 1.25fr; gap:8px; }
    .reset,.submit { border:0; border-radius:12px; min-height:48px; padding:8px 10px; font-weight:850; font-size:14px; }
    .reset { background:color-mix(in srgb,var(--accent) 9%,var(--card)); color:var(--accent); }
    .submit { background:var(--accent); color:var(--accentText); }
    .submit:disabled { opacity:.45; }
    .demo { display:none; margin:10px 0; white-space:pre-wrap; font-size:11px; color:var(--hint); word-break:break-word; }
    @media (max-width:390px) {
      .app { padding-left:7px; padding-right:7px; }
      .workspace { grid-template-columns:52px minmax(0,1fr); gap:6px; }
      .floor-btn { min-height:39px; font-size:12px; }
      .columns { gap:5px; }
      .category-head { padding:7px 6px 6px; }
      .category-head strong { font-size:14px; }
      .category-head span { display:none; }
      .item { min-height:37px; padding:4px 4px; gap:3px; }
      .item-name { font-size:13.4px; }
      .stepper { grid-template-columns:22px 32px 22px; gap:1px; }
      .stepper button { width:22px; height:27px; font-size:17px; }
      .qty { width:32px; height:27px; font-size:12.5px; }
      .footer-inner { grid-template-columns:.92fr 1.28fr; }
      .reset,.submit { font-size:13px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="title">소모품 · 미니바 입력</div>
    <p class="sub">왼쪽에서 층을 선택하고 소모품·미니바 수량을 함께 입력합니다.</p>
    <div class="search-wrap">
      <div class="search-icon">⌕</div>
      <input id="itemSearch" class="search-input" type="search" autocomplete="off" enterkeyhint="search" placeholder="품목 검색 · 크 → 크리넥스">
      <button id="searchClear" class="search-clear" type="button" aria-label="검색 지우기">×</button>
    </div>
    <div id="searchNote" class="search-note"></div>

    <div class="workspace">
      <nav id="floors" class="floors" aria-label="층 선택"></nav>

      <section class="content">
        <div class="floor-status">
          <strong id="floorTitle">4층 입력 중</strong>
          <span id="floorSummary">입력 없음</span>
        </div>

        <div class="columns">
          <section class="category">
            <div class="category-head"><strong>소모품</strong><span id="consumableCount">0개</span></div>
            <div id="consumableItems" class="item-list"></div>
          </section>
          <section class="category">
            <div class="category-head"><strong>미니바</strong><span id="minibarCount">0개</span></div>
            <div id="minibarItems" class="item-list"></div>
          </section>
        </div>
        <div class="add-item-wrap"><button id="addItem" class="add-item" type="button">＋ 새 항목 추가</button></div>
        <pre id="demo" class="demo"></pre>
      </section>
    </div>
  </main>

  <div id="addModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="addModalTitle">
    <div class="modal">
      <h3 id="addModalTitle">새 항목 추가</h3>
      <p>추가한 항목은 이 기기에서 다음 입력 때도 표시됩니다.</p>
      <div class="category-choice">
        <button id="chooseConsumable" class="active" type="button">소모품</button>
        <button id="chooseMinibar" type="button">미니바</button>
      </div>
      <input id="newItemName" class="new-item-input" maxlength="24" autocomplete="off" placeholder="품목명 입력">
      <div class="modal-actions">
        <button id="cancelAdd" class="modal-cancel" type="button">취소</button>
        <button id="confirmAdd" class="modal-add" type="button">추가</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-inner">
      <button id="resetFloor" class="reset" type="button">현재층 초기화</button>
      <button id="submit" class="submit" type="button" disabled>전체 입력 완료</button>
    </div>
  </footer>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
(() => {
  'use strict';
  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); }
  const launchParams = new URLSearchParams(window.location.search);
  const DEFAULT_BOT_USERNAME = 'PHS_Housemanbot';
  const DEFAULT_SUBMIT_PATH = '/phs-miniapp/daily-stock/submit';
  const requestedSubmit = String(launchParams.get('phs_submit')||'').trim();
  const SUBMIT_URL = requestedSubmit ? new URL(requestedSubmit, window.location.href).toString() : new URL(DEFAULT_SUBMIT_PATH, window.location.origin).toString();
  const BOT_STORAGE_KEY = 'phs_daily_stock_bot_username_v1';
  const launchBot = String(launchParams.get('phs_bot')||'').replace(/[^0-9A-Za-z_]/g,'');
  let savedBot='';
  try { savedBot=String(localStorage.getItem(BOT_STORAGE_KEY)||'').replace(/[^0-9A-Za-z_]/g,''); } catch (_) {}
  const BOT_USERNAME = launchBot || savedBot || DEFAULT_BOT_USERNAME;
  if (launchBot) { try { localStorage.setItem(BOT_STORAGE_KEY,launchBot); } catch (_) {} }
  const COMMAND_NAME = ['소모품','미니바'].includes(launchParams.get('phs_cmd')) ? launchParams.get('phs_cmd') : '소모품';
  const INLINE_LAUNCH = Boolean(tg && tg.initDataUnsafe && tg.initDataUnsafe.query_id);

  const FLOORS = Array.from({length:19}, (_,i) => i + 4); // room master: 4F~22F
  const BASE_CATALOG = {
    consumable: [
      '샴푸','컨디셔너','샤워젤','로션','루파','샤워캡','헤어밴드','코튼패드','코튼버드','새니터리백',
      '덴탈키트','슈미트','이어플러그','비닐런드리백','천런드리백','슈백','슬리퍼대','슬리퍼소','크리넥스','롤휴지',
      'AA배터리','AAA배터리','코인배터리','지우개','멀티플러그','연필','볼펜','와인오프너','충전케이블','쇼핑백대','쇼핑백소','비누','배스솔트'
    ],
    minibar: [
      '코카콜라','제로콜라','스프라이트','환타','레드불','클럽소다','토닉워터','하이트','하이네켄','우유','에비앙',
      '하리보','프링글스','엠앤엠즈','킷캣','스니커즈','육포'
    ]
  };
  const SEARCH_ALIASES = {"샴푸":["샴"],"컨디셔너":["컨디","컨"],"샤워젤":["샤워","샤"],"로션":["로"],"루파":["루"],"샤워캡":["캡"],"헤어밴드":["헤어","헤"],"코튼패드":["화장솜","패드"],"코튼버드":["면봉","버드"],"새니터리백":["위생백","새니","위생"],"덴탈키트":["칫솔","칫","덴탈","덴"],"슈미트":["미트"],"이어플러그":["귀마개","귀","이"],"비닐런드리백":["비닐런"],"천런드리백":["천","천런"],"슈백":[],"슬리퍼대":["슬대"],"슬리퍼소":["슬소"],"크리넥스":["크리","크","각티슈"],"롤휴지":["롤"],"AA배터리":["aa"],"AAA배터리":["aaa"],"코인배터리":["코인"],"지우개":["지"],"멀티플러그":["멀티","멀"],"연필":["연"],"볼펜":["볼","펜"],"와인오프너":["와인","와"],"충전케이블":["삼선","충전","충"],"쇼핑백대":["쇼대","백대"],"쇼핑백소":["쇼소","백소"],"비누":[],"배스솔트":["배스","배","입욕제","입욕"],"코카콜라":["코카","코"],"제로콜라":["제콜","제로","제"],"스프라이트":["스프","스"],"환타":["환"],"레드불":["레드","레"],"클럽소다":["클럽","소다","클"],"토닉워터":["토닉","토"],"하이트":["트"],"하이네켄":["네켄","켄"],"우유":["우"],"에비앙":[],"하리보":["하리","하"],"프링글스":["프링","프"],"엠앤엠즈":["엠엠","엠","mnm"],"킷캣":["킷"],"스니커즈":["스니"],"육포":["육"]};
  const MAX_ONE_UNIT_BY_NORM = {
    '루파':'봉지','샤워캡':'봉지','헤어밴드':'봉지','코튼패드':'봉지','코튼버드':'봉지','새니터리백':'봉지','덴탈키트':'봉지','슈미트':'봉지','이어플러그':'봉지','천런드리백':'봉지','슈백':'봉지',
    '슬리퍼대':'박스','슬리퍼소':'박스','크리넥스':'박스','비누':'박스','배스솔트':'박스','커피3종':'박스','커피3종(스위트)':'박스',
    '롤휴지':'묶음','비닐런드리백':'묶음','쇼핑백대':'묶음','쇼핑백소':'묶음'
  };
  const policyKey = value => String(value||'').toLowerCase().replace(/\s+/g,'');
  const qtyLimit = item => Object.prototype.hasOwnProperty.call(MAX_ONE_UNIT_BY_NORM,policyKey(item)) ? 1 : 999;
  const displayUnit = item => MAX_ONE_UNIT_BY_NORM[policyKey(item)] || '';
  const CUSTOM_STORAGE_KEY = 'phs_daily_stock_custom_catalog_v1';
  function loadCustomCatalog() {
    try {
      const saved=JSON.parse(localStorage.getItem(CUSTOM_STORAGE_KEY)||'{}');
      return {
        consumable:Array.isArray(saved.consumable)?saved.consumable.filter(Boolean).slice(0,20):[],
        minibar:Array.isArray(saved.minibar)?saved.minibar.filter(Boolean).slice(0,20):[],
      };
    } catch (_) { return {consumable:[],minibar:[]}; }
  }
  function loadSharedCatalogFromUrl() {
    const params=new URLSearchParams(window.location.search);
    const clean=values=>values.map(v=>String(v||'').trim().replace(/\s+/g,' ')).filter(Boolean).slice(0,20);
    return {consumable:clean(params.getAll('phs_c')),minibar:clean(params.getAll('phs_m'))};
  }
  const storedCatalog=loadCustomCatalog();
  const sharedCatalog=loadSharedCatalogFromUrl();
  const customCatalog={
    consumable:[...new Set([...sharedCatalog.consumable,...storedCatalog.consumable])].slice(0,20),
    minibar:[...new Set([...sharedCatalog.minibar,...storedCatalog.minibar])].slice(0,20),
  };
  try { localStorage.setItem(CUSTOM_STORAGE_KEY,JSON.stringify(customCatalog)); } catch (_) {}
  const CATALOG={
    consumable:[...BASE_CATALOG.consumable,...customCatalog.consumable.filter(x=>!BASE_CATALOG.consumable.includes(x))],
    minibar:[...BASE_CATALOG.minibar,...customCatalog.minibar.filter(x=>!BASE_CATALOG.minibar.includes(x))],
  };
  const DISPLAY = {};
  const state = { floor: 4, floors: {} };
  const el = id => document.getElementById(id);

  function emptyFloor() { return {consumable:{}, minibar:{}}; }
  function floorState(floor, create=true) {
    const key=String(floor);
    if (!state.floors[key] && create) state.floors[key]=emptyFloor();
    return state.floors[key] || emptyFloor();
  }
  function cleanupFloor(floor) {
    const f=state.floors[String(floor)];
    if (f && !Object.keys(f.consumable).length && !Object.keys(f.minibar).length) delete state.floors[String(floor)];
  }
  function categoryQty(floor, category) {
    return Object.values(floorState(floor,false)[category] || {}).reduce((a,b)=>a+Number(b||0),0);
  }
  function floorQty(floor) { return categoryQty(floor,'consumable') + categoryQty(floor,'minibar'); }
  function qtyOf(category,item) { return Number((floorState(state.floor,false)[category] || {})[item] || 0); }
  function storeQty(category,item,value) {
    const f=floorState(state.floor,true);
    const digits=String(value ?? '').replace(/[^0-9]/g,'');
    const parsed=digits ? Number.parseInt(digits,10) : 0;
    const next=Math.max(0,Math.min(qtyLimit(item),Number.isFinite(parsed)?parsed:0));
    if (next) f[category][item]=next; else delete f[category][item];
    cleanupFloor(state.floor);
    return next;
  }
  function changeQty(category,item,delta) {
    storeQty(category,item,Number(qtyOf(category,item)||0)+delta);
    if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
    render();
  }
  function setFloor(floor) {
    if (!FLOORS.includes(Number(floor))) return;
    state.floor=Number(floor);
    if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
    render();
  }
  function totals() {
    let floors=0, items=0, qty=0;
    for (const f of Object.values(state.floors)) {
      let used=false;
      for (const c of ['consumable','minibar']) for (const n of Object.values(f[c])) { items++; qty+=Number(n); used=true; }
      if (used) floors++;
    }
    return {floors,items,qty};
  }
  function renderFloors() {
    const root=el('floors'); root.innerHTML='';
    for (const floor of FLOORS) {
      const b=document.createElement('button');
      b.type='button'; b.className='floor-btn'+(floor===state.floor?' active':'')+(floorQty(floor)>0?' used':'');
      b.textContent=`${floor}층`; b.onclick=()=>setFloor(floor); root.append(b);
    }
  }
  function searchTerms(category,item) {
    const display=DISPLAY[item]||item;
    return [item,display,...(SEARCH_ALIASES[item]||[])].map(v=>normalizeSearch(v)).filter(Boolean);
  }
  function renderCategory(category,rootId) {
    const root=el(rootId); root.innerHTML='';
    for (const item of CATALOG[category]) {
      const row=document.createElement('div');
      row.className='item'+(customCatalog[category].includes(item)?' custom-item':'');
      row.dataset.category=category; row.dataset.item=item; row.dataset.search=searchTerms(category,item).join('|');
      const name=document.createElement('div'); name.className='item-name'; const label=DISPLAY[item]||item; const unit=displayUnit(item); name.textContent=label; name.title=unit?`${label} · ${unit}`:(item===DISPLAY[item]||!DISPLAY[item]?item:`${DISPLAY[item]} · ${item}`);
      const step=document.createElement('div'); step.className='stepper';
      const minus=document.createElement('button'); minus.type='button'; minus.textContent='−'; minus.disabled=qtyOf(category,item)<=0; minus.onclick=()=>changeQty(category,item,-1);
      const qty=document.createElement('input');
      qty.type='text'; qty.inputMode='numeric'; qty.pattern='[0-9]*'; qty.autocomplete='off'; qty.enterKeyHint='done';
      qty.setAttribute('aria-label',`${label} 수량`); qty.className='qty'+(qtyOf(category,item)>0?' nonzero':''); qty.value=String(qtyOf(category,item));
      const plus=document.createElement('button'); plus.type='button'; plus.textContent='+'; plus.disabled=qtyOf(category,item)>=qtyLimit(item); plus.onclick=()=>changeQty(category,item,1);
      qty.onfocus=()=>{ try { qty.select(); } catch (_) {} };
      qty.oninput=()=>{
        const next=storeQty(category,item,qty.value);
        qty.value=String(next);
        qty.classList.toggle('nonzero',next>0);
        minus.disabled=next<=0; plus.disabled=next>=qtyLimit(item);
        renderFloors(); renderStatus();
      };
      qty.onblur=()=>{ qty.value=String(qtyOf(category,item)); };
      step.append(minus,qty,plus); row.append(name,step); root.append(row);
    }
  }
  function renderStatus() {
    const c=categoryQty(state.floor,'consumable'), m=categoryQty(state.floor,'minibar'), t=totals();
    el('floorTitle').textContent=`${state.floor}층 입력 중`;
    el('floorSummary').textContent=(c+m) ? `소모품 ${c} · 미니바 ${m}` : '입력 없음';
    el('consumableCount').textContent=`${c}개`;
    el('minibarCount').textContent=`${m}개`;
    el('submit').disabled=!t.qty;
    el('submit').textContent='전체 입력 완료';
  }
  function render() { renderFloors(); renderCategory('consumable','consumableItems'); renderCategory('minibar','minibarItems'); renderStatus(); }
  function buildPayload() {
    const payload={consumable:{},minibar:{}};
    for (const [floor,f] of Object.entries(state.floors)) for (const c of ['consumable','minibar']) if (Object.keys(f[c]).length) payload[c][floor]={...f[c]};
    return {type:'phs_daily_stock_v1',payload,custom_catalog:{consumable:[...customCatalog.consumable],minibar:[...customCatalog.minibar]}};
  }
  function commandItem(item,qty) {
    const name=/\s/.test(item)?`"${item}"`:item;
    return `${name}${Number(qty)}`;
  }
  function buildCommand() {
    // `/소모품` parser accepts both consumable and minibar canonical items, so a
    // single universal command is valid even when this page was opened directly.
    const parts=['/소모품'];
    const floors=Object.keys(state.floors).map(Number).sort((a,b)=>a-b);
    for (const floor of floors) {
      const f=floorState(floor,false);
      const items=[];
      for (const category of ['consumable','minibar']) {
        for (const item of CATALOG[category]) {
          const qty=Number((f[category]||{})[item]||0);
          if (qty>0) items.push(commandItem(item,qty));
        }
      }
      if (items.length) parts.push(`${floor}층`,...items);
    }
    return parts.join(' ');
  }
  function itemDisplay(item,qty) {
    const unit=displayUnit(item);
    return `${item}${Number(qty)}${unit}`;
  }
  function buildPlainText() {
    const sections=[];
    for (const [category,title] of [['consumable','금일 소모품'],['minibar','금일 미니바']]) {
      const lines=[];
      const floors=Object.keys(state.floors).map(Number).sort((a,b)=>a-b);
      for (const floor of floors) {
        const f=floorState(floor,false);
        const items=[];
        for (const item of CATALOG[category]) {
          const qty=Number((f[category]||{})[item]||0);
          if (qty>0) items.push(itemDisplay(item,qty));
        }
        if (items.length) lines.push(`${String(floor).padStart(2,'0')}층 ${items.join(' ')}`);
      }
      if (lines.length) sections.push([title,...lines].join('\n'));
    }
    return sections.join('\n\n');
  }
  let submitInFlight=false;
  async function postCompletion(envelope) {
    if (!tg || !String(tg.initData||'')) throw new Error('Telegram 안에서 미니앱을 실행해주세요.');
    if (!/^https:\/\//i.test(SUBMIT_URL)) throw new Error('완료 전송 주소가 설정되지 않았습니다.');
    if (new URL(SUBMIT_URL).origin !== window.location.origin) throw new Error('완료 전송 주소가 현재 미니앱 주소와 다릅니다.');
    const response=await fetch(SUBMIT_URL,{
      method:'POST',
      mode:'same-origin',
      credentials:'omit',
      cache:'no-store',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({init_data:String(tg.initData||''),envelope}),
    });
    let result={};
    try { result=await response.json(); } catch (_) {}
    if (!response.ok || !result || result.ok!==true) {
      throw new Error(String((result&&result.message)||'결과 전송에 실패했습니다. 다시 눌러주세요.'));
    }
    return result;
  }
  function closeMiniApp() {
    if (tg && typeof tg.close==='function') { tg.close(); return; }
    try { window.close(); } catch (_) {}
  }
  async function submit() {
    if (submitInFlight) return;
    const envelope=buildPayload();
    const plain=buildPlainText();
    if (!plain) { notify('선택된 품목이 없습니다.'); return; }
    submitInFlight=true;
    try {
      // Telegram delivery is authoritative. Close only after server ACK.
      await postCompletion(envelope);
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      closeMiniApp();
    } catch (err) {
      submitInFlight=false;
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
      const msg=String((err&&err.message)||'');
      notify(msg==='Failed to fetch' ? '서버 연결에 실패했습니다. 잠시 후 다시 눌러주세요.' : (msg||'결과 전송에 실패했습니다. 다시 눌러주세요.'));
    }
  }
  function normalizeSearch(value) { return String(value||'').toLowerCase().replace(/\s+/g,''); }
  function clearSearchHit() { document.querySelectorAll('.item.search-hit').forEach(row=>row.classList.remove('search-hit')); }
  function runSearch() {
    const input=el('itemSearch'), raw=input.value, q=normalizeSearch(raw);
    el('searchClear').classList.toggle('visible',Boolean(raw));
    clearSearchHit();
    if (!q) { el('searchNote').textContent=''; return; }
    const rows=[...document.querySelectorAll('.item[data-search]')];
    const ranked=rows.map((row,index)=>{
      const terms=String(row.dataset.search||'').split('|');
      let score=99;
      for (const term of terms) {
        if (term===q) score=Math.min(score,0);
        else if (term.startsWith(q)) score=Math.min(score,1);
        else if (term.includes(q)) score=Math.min(score,2);
      }
      return {row,index,score};
    }).filter(x=>x.score<99).sort((a,b)=>a.score-b.score||a.index-b.index);
    if (!ranked.length) { el('searchNote').textContent=`“${raw}” 검색 결과 없음`; return; }
    const hit=ranked[0].row; hit.classList.add('search-hit');
    const item=hit.dataset.item||''; const label=DISPLAY[item]||item;
    el('searchNote').textContent=ranked.length>1 ? `${label} 외 ${ranked.length-1}개 검색됨` : `${label} · ${item}`;
    hit.scrollIntoView({behavior:'smooth',block:'center'});
  }
  function notify(text) {
    if (tg && typeof tg.showAlert==='function') tg.showAlert(text); else window.alert(text);
  }
  let addCategory='consumable';
  function setAddCategory(category) {
    addCategory=category;
    el('chooseConsumable').classList.toggle('active',category==='consumable');
    el('chooseMinibar').classList.toggle('active',category==='minibar');
  }
  function openAddModal() {
    setAddCategory('consumable'); el('newItemName').value=''; el('addModal').classList.add('open');
    setTimeout(()=>el('newItemName').focus(),80);
  }
  function closeAddModal() { el('addModal').classList.remove('open'); }
  function addCustomItem() {
    const name=String(el('newItemName').value||'').trim().replace(/\s+/g,' ');
    if (!/^[0-9A-Za-z가-힣ㄱ-ㅎㅏ-ㅣ][0-9A-Za-z가-힣ㄱ-ㅎㅏ-ㅣ ._+&()\/-]{0,23}$/.test(name)) { notify('품목명을 1~24자로 입력해주세요.'); return; }
    const other=addCategory==='consumable'?'minibar':'consumable';
    if (CATALOG[other].includes(name)) { notify('같은 이름의 품목이 다른 구분에 이미 있습니다.'); return; }
    if (!CATALOG[addCategory].includes(name)) {
      if (customCatalog.consumable.length+customCatalog.minibar.length>=24 || customCatalog[addCategory].length>=20) { notify('추가 품목 수가 너무 많습니다.'); return; }
      customCatalog[addCategory].push(name); CATALOG[addCategory].push(name);
      try { localStorage.setItem(CUSTOM_STORAGE_KEY,JSON.stringify(customCatalog)); } catch (_) {}
    }
    closeAddModal(); render();
    el('itemSearch').value=name; runSearch();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
  }
  el('itemSearch').addEventListener('input',runSearch);
  el('itemSearch').addEventListener('search',runSearch);
  el('searchClear').onclick=()=>{ el('itemSearch').value=''; runSearch(); el('itemSearch').focus(); };
  el('addItem').onclick=openAddModal;
  el('chooseConsumable').onclick=()=>setAddCategory('consumable');
  el('chooseMinibar').onclick=()=>setAddCategory('minibar');
  el('cancelAdd').onclick=closeAddModal;
  el('confirmAdd').onclick=addCustomItem;
  el('newItemName').addEventListener('keydown',e=>{ if (e.key==='Enter') addCustomItem(); });
  el('addModal').addEventListener('click',e=>{ if (e.target===el('addModal')) closeAddModal(); });
  el('resetFloor').onclick=()=>{ delete state.floors[String(state.floor)]; if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light'); render(); };
  el('submit').onclick=submit;
  render();
})();
</script>
</body>
